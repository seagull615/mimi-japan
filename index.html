<html lang="ko">
<head>
<meta charset="UTF-8">

<title>기초 일본어 명사 100</title>
<style>
  * { box-sizing: border-box; }

  :root {
    --ipa-size: 16px;
    --ipa-color: #888;
  }

  body {
    margin: 0;
    padding: 28px 16px 40px;
    background: #f7f5f0;
    color: #222;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  header {
    max-width: 900px;
    margin: 0 auto 22px;
    text-align: center;
  }

  header h1 {
    font-size: 22px;
    margin: 0 0 6px;
  }

  header p {
    margin: 0 0 14px;
    color: #888;
    font-size: 14px;
  }

  .refresh-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: none;
    background: #222;
    color: #fff;
    font-size: 14px;
    padding: 10px 20px;
    border-radius: 999px;
    cursor: pointer;
  }

  .refresh-btn:hover {
    background: #444;
  }

  #cardsNoms {
    display: flex;
    gap: 20px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    padding: 6px 6px 20px;
    -webkit-overflow-scrolling: touch;
  }

  #cardsNoms::-webkit-scrollbar {
    height: 8px;
  }

  #cardsNoms::-webkit-scrollbar-thumb {
    background: #ddd;
    border-radius: 999px;
  }

  .card {
    flex: 0 0 auto;
    scroll-snap-align: start;
    width: min(88vw, 560px);
    background: #ffffff;
    border-radius: 20px;
    padding: 28px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
  }

  .part-of-speech {
    display: inline-block;
    padding: 5px 10px;
    border-radius: 8px;
    background: #eee;
    font-size: 13px;
    margin-bottom: 14px;
  }

  .pos-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
  }

  .word-line {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    column-gap: 12px;
    row-gap: 4px;
    margin-bottom: 4px;
  }

  .word-detail {
    font-size: 32px;
    font-weight: 700;
    word-break: keep-all;
  }

  .reading {
    font-size: 16px;
    color: #999;
  }

  .phonetics {
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin-bottom: 16px;
  }

  .phon-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-size: var(--ipa-size);
    color: var(--ipa-color);
  }

  .phon-tag {
    font-size: 11px;
    color: #bbb;
    min-width: 34px;
  }

  .phon-jamo {
    letter-spacing: 1px;
    color: #777;
    font-weight: 500;
  }

  .speak-btn {
    border: 1px solid #ddd;
    background: #fff;
    border-radius: 999px;
    font-size: 13px;
    padding: 7px 16px;
    cursor: pointer;
    margin-bottom: 18px;
  }

  .speak-btn:hover {
    background: #f5f5f5;
  }

  .content-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
    padding-top: 16px;
    border-top: 1px solid #f0f0f0;
  }

  .info-label {
    display: block;
    font-size: 12px;
    color: #999;
    margin-bottom: 8px;
  }

  .meaning {
    font-size: 19px;
    margin: 0;
  }

  .example {
    border-left: 4px solid #222;
    padding: 10px 16px;
    margin: 16px 0 0;
    background: #fafafa;
    border-radius: 0 8px 8px 0;
  }

  .example .jp {
    font-size: 17px;
    margin-bottom: 5px;
  }

  .example .korean {
    color: #666;
    font-size: 15px;
  }

  footer {
    max-width: 900px;
    margin: 20px auto 0;
    text-align: center;
    color: #bbb;
    font-size: 12px;
  }

  @media (max-width: 480px) {
    .card { padding: 22px 18px; border-radius: 16px; }
    .word-detail { font-size: 27px; }
    :root { --ipa-size: 14px; }
  }
</style>
</head>
<body>

<header>
  <h1>기초 일본어 명사 100 (基礎名詞)</h1>

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function getRandomWords(n, database) {
    const indices = shuffle([...Array(database.length).keys()]);
    return indices.slice(0, n).map(i => database[i]);
  }

  function speak(reading) {
    if (!('speechSynthesis' in window)) return;
    const utter = new SpeechSynthesisUtterance(reading);
    utter.lang = 'ja-JP';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utter);
  }

  function render(containerId, database, n) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    getRandomWords(n, database).forEach(entry => container.appendChild(buildCard(entry)));
    container.scrollTo({ left: 0 });
  }

  document.getElementById('refreshBtnNoms').addEventListener('click', () => render('cardsNoms', DATABASE_NOMS, WORDS_PER_SET_NOMS));

  render('cardsNoms', DATABASE_NOMS, WORDS_PER_SET_NOMS);
</script>

</body>
</html>
